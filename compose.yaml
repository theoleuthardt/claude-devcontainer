services:
  blm-dev:
    build:
      context: .
      dockerfile: Containerfile
      args:
        UID: ${DEV_UID:-1000}
        GID: ${DEV_GID:-1000}
    image: blm-dev
    container_name: blm-dev
    userns_mode: keep-id
    network_mode: host
    init: true
    restart: unless-stopped
    volumes:
      - ~/work/backlog-manager:/workspace
      - /run/user/${DEV_UID:-1000}/podman/podman.sock:/run/podman.sock
      - blm-claude:/home/dev/.claude
      - blm-gh:/home/dev/.config/gh

volumes:
  blm-claude:
  blm-gh:
