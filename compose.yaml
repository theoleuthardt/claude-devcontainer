services:
  blm-dev:
    image: ghcr.io/theoleuthardt/claude-devcontainer:latest
    container_name: blm-dev
    network_mode: host
    init: true
    restart: unless-stopped
    volumes:
      - ~/work/backlog-manager:/workspace
      - /run/podman/podman.sock:/run/podman.sock
      - blm-claude:/root/.claude
      - blm-gh:/root/.config/gh

volumes:
  blm-claude:
  blm-gh:
